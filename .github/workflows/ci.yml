name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (a tag can be moved by whoever controls
# the action's repository). Dependabot keeps them up to date.
jobs:
  check:
    name: Lint, test and build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check go.mod and go.sum are tidy
        run: go mod tidy -diff

      - name: Vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

      - name: Test
        run: go test -count=1 ./...

      - name: Build
        run: go build -trimpath -o avanet.exe ./cmd/avanet

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  race:
    # The race detector needs cgo, which the Windows runner does not set up;
    # platform-independent packages are checked for data races on Linux.
    name: Race detector (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Test with race detector
        run: go test -count=1 -race ./...

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not only the last commit
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --verbose .
