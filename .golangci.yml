version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose # HTTP response bodies must be closed (speed tests)
    - contextcheck # functions receiving a context must pass it on
    - errname # sentinel errors named ErrXxx
    - errorlint # compare errors with errors.Is/As, wrap with %w
    - exhaustive # switches over enums handle every value
    - gocritic
    - gosec # security checks
    - misspell
    - nilerr # returning nil while holding an error
    - noctx # network calls must take a context
    - nolintlint # //nolint must be specific and explained
    - revive
    - rowserrcheck # rows.Err() is checked
    - sqlclosecheck # rows/statements are closed
    - unconvert
    - unparam
    - usestdlibvars
    - wastedassign
  settings:
    errcheck:
      exclude-functions:
        # Writing user-facing messages to stdout/stderr: there is nothing
        # useful to do if the terminal itself is gone.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    gocritic:
      enabled-tags: [diagnostic, performance, style]
      disabled-checks:
        - whyNoLint # covered by nolintlint
      settings:
        hugeParam:
          # Small value types (a few machine words, like domain.Network) read
          # better by value; anything larger goes by pointer.
          sizeThreshold: 128
    misspell:
      # The user interface is in Portuguese; these are not English typos.
      ignore-rules: [comando, comandos, programas, respondendo]
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    rules:
      # Test fixtures use fixed file paths and permissions on purpose.
      - path: _test\.go
        linters: [gosec]
      # Calling the Win32 API requires unsafe.Pointer. It is confined to
      # *_windows.go files, and the mirrored C struct layouts are pinned by tests.
      - path: _windows\.go
        linters: [gosec]
        text: G103

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Reinaldo-Porfirio/avanet
